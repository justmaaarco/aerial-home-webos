[package]
name = "aerial-native-probe"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native SDL2 launcher for rooted LG webOS TVs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
sdl = []

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
